# Reference logrotate config for rspamd's file log. entrypoint generates
# the live config from this template at startup,
__LOGFILE__ {
    missingok
    notifempty
    size __SIZE__
    rotate __ROTATE__
    compress
    delaycompress
    create 0644
    sharedscripts
    postrotate
        kill -USR1 1 2>/dev/null || true
    endscript
}
