# Default values for rspamd.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


persistence:
  enabled: false
  existingClaim: ""
  accessMode: ReadWriteOnce
  size: 128Mi
  storageClass: ""
  volumeName: ""
  annotations:
    "helm.sh/resource-policy": keep
  # -- Only mount a subpath of the Volume into the pod
  subPath: ""


# Deployment update strategy. Recreate because the data PVC is ReadWriteOnce.
# RollingUpdate spins up a second pod that can't attach the volume
strategy:
  type: Recreate

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/ietf-tools/container-rspamd
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  controllerPort: 11334
  port: 11333
  proxyPort: 11332
  fuzzy: 11335


resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
#livenessProbe:
#  httpGet:
#    path: /
#    port: http
#readinessProbe:
#  httpGet:
#    path: /
#    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

dnsPolicy: ""

dnsConfig: {}

nodeSelector: {}

tolerations: []

affinity: {}

rspamd:
  reject: "null"
  greylist: "null"

  logging:
    # level/log_usec/debug_modules are merged into rspamd via local.d/logging.inc.
    level: "info"
    log_usec: false
    debug_modules: ["dkim_signing"]
    # type/filename drive the image's RSPAMD_LOG_* env. type=file makes the
    # entrypoint point rspamd at the file (override.d/logging.inc) and tail it;
    # type=console leaves upstream stdout logging untouched.
    type: "file"
    filename: "/var/log/rspamd/rspamd.log"
    tail: true # send active log to stdout for container log shipping

    rotate:
      enabled: true
      size: "100M"
      keep: 3
      intervalSeconds: 500

  historyRedis:
    nrows: 200
    keyPrefix: "rs_history"
    compress: true
    subjectPrivacy: false

  dkim:
    allow_hdrfrom_mismatch_sign_networks: "true"
    allow_username_mismatch: "true"
    sign_authenticated: "true"
    sign_local: "true"
    sign_inbound: "true"
    use_domain: "envelope"
    use_esld: "false"
    allow_hdrfrom_mismatch: "true"
    domains:
      - name: dene.com
        selector: mail
      - name: lists.sys.slush.ca
        selector: 2020

  milterHeaders: |
    use = ["x-spamd-bar", "x-spam-level", "authentication-results"];
    authenticated_headers = ["authentication-results"];

  arc:
    enabled: "true"
    selector: arc
    use_domain: recipient
    use_esld: "false"
    sign_inbound: "true"
    sign_local: "true"
    sign_authenticated: "true"
    allow_envfrom_empty: "true"
    allow_hdrfrom_mismatch: "true"
    allow_hdrfrom_mismatch_local: "true"
    allow_hdrfrom_mismatch_sign_networks: "true"
    allow_hdrfrom_multiple: "true"
    allow_username_mismatch: "true"
    sign_headers: "list-unsubscribe:list-archive:list-help:list-post:list-id:precedence:to:subject:message-id:date:from:mime-version:dkim-signature"

valkey:
  enabled: true

  replica:
    enabled: true
    replicas: 2
    persistence:
      size: "1Gi"

  dataStorage:
    enabled: true
    requestedSize: 1Gi

  metrics:
    enabled: true

filebeat:
  filebeatVersion: 9.3.3
  enabled: false
  tlsCA: false
  # Empty -> falls back to the chart's fullname (release-name-rspamd).
  loggingHostname: ""
  logstashHost: 127.0.0.1
  logstashPort: 5044
  logstashTags:
    - rspamd
  filePaths:
    - /var/log/rspamd/rspamd.log
