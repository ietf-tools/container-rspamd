apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rspamd.fullname" . }}
  labels: {{- include "rspamd.labels" . | nindent 4}}
data:
{{- if .Values.rspamd.jevEnabled }}
  rspamd.conf.local: |
    jev {
      .include "$LOCAL_CONFDIR/local.d/jev.conf"
    }
  jev.conf: |
    enabled = true;
    mode = "live";
    url = "https://api.typesafe.ai/v1/systemone";
    model = "jev-1.14.0";
    allow_external = true;
    # set by read -rs JEV_KEY && printf '%s' "$JEV_KEY" | redis-cli -x SET jev_api_key; unset JEV_KEY
    api_key_redis_key = "jev_api_key";
    recipient_domains = ["*"];

    # Optional: require an existing gpt module result before querying Jev.
    # false works with plain Rspamd; true requires GPT_CHECK and GPT_* results.
    require_gpt = false;
    sample_rate = 1.0;
    timeout = 1.5;

    # PER WORKER, not global. No retries or cache.
    requests_per_second = 100;
    max_inflight = 20;
    cooldown = 60;

    max_message_bytes = 1048576;
    max_body_bytes = 16000;
    max_request_bytes = 49152;
    max_urls = 32;
    max_attachments = 8;

    # Only changes observation labels; never changes scores or actions.
    probability_threshold = {{ .Values.rspamd.jevProbabilityThreshold }};
    confidence_threshold = {{ .Values.rspamd.jevConfidenceThreshold }};
{{- end }}
  settings.conf: |
    list_bounces {
      priority = high;
      # Mailman bounce addresses: plain, VERP (+user=dom) and DMARC-mangled (=40)
      rcpt = "/-bounces([+=@])/i";
      apply {
        # skip Bayes for these messages: no BAYES_* scoring, no autolearn
        symbols_disabled = ["BAYES_SPAM", "BAYES_HAM"];
        flags = ["no_stat"];
      }
    }
    dmarc_reports {
      priority = high;
      # DMARC reports: many reporters' hostnames don't resolve and trip MX/HELO checks.
      # Skip all checks so none are tagged or rejected before the report pipeline reads them.
      rcpt = ["dmarc-report@ietf.org", "dmarc_report@ietf.org"];
      want_spam = yes;
    }
  spamtrap.conf: |
    enabled = true;
    action = "no action";
    score = 1.0;
    learn_fuzzy = true;
    learn_spam = true;
    # map removed → Redis lookups are used instead
    # key_prefix = "sptr_";   # default, change if you like
  worker-fuzzy.inc: |
    count = 2;
    bind_socket = "*:11335";
    backend = "redis";        # uses the servers from local.d/redis.conf
    expire = 90d;
    allow_update = ["127.0.0.1", "::1"];
  fuzzy_check.conf: |
    rule "SPAM_CAMPAIGNS" {
      servers = "localhost:11335";
      algorithm = "mumhash";

      fuzzy_map = {
        FUZZY_SPAM_TEMPLATES {
          flag = 200;
          hits_limit = 15.0;
        }
      }
    }

    rule "FUZZY_LOCAL" {
      # Server(s) to query - required
      servers = "localhost:11335";

      # Hash algorithm: mumhash (default), fasthash, xxhash, siphash
      algorithm = "mumhash";

      # Allow write operations (learning) to this storage; set true to disallow
      read_only = false;
      text_shingles = true;
      html_shingles = true;
      min_html_tags = 15;
      html_weight = 1.0;

      # Map flags to symbols
      fuzzy_map = {
        FUZZY_DENIED {
          flag = 1;
          max_score = 20.0;
        }
        FUZZY_PROB {
          flag = 2;
          max_score = 10.0;
        }
        FUZZY_WHITE {
          flag = 3;
          max_score = 2.0;
        }
        # Learned automatically from high-scoring inbound spam (fuzzy_autolearn.lua).
        # Kept apart from FUZZY_DENIED so it can be weighted and cleared on its own:
        #   rspamc fuzzy_del -f {{ .Values.rspamd.fuzzy_autolearn.flag }} message.eml
        FUZZY_AUTO {
          flag = {{ .Values.rspamd.fuzzy_autolearn.flag }};
          max_score = 10.0;
        }
      }
    }
  fuzzy_group.conf: |
    max_score = 12.0;
    symbols = {
        "FUZZY_DENIED" {
            weight = 12.0;
            description = "Denied fuzzy hash";
        }
        "FUZZY_PROB" {
            weight = 5.0;
            description = "Probable fuzzy hash";
        }
        "FUZZY_WHITE" {
            weight = -2.1;
            description = "Whitelisted fuzzy hash";
        }
        "FUZZY_UNKNOWN" {
            weight = 5.0;
            description = "Generic fuzzy hash match";
        }
        "LOCAL_FUZZY_UNKNOWN" {
            weight = 5.0;
            description = "Generic fuzzy hash match";
        }
        "LOCAL_FUZZY_DENIED" {
            weight = 12.0;
            description = "Denied fuzzy hash";
        }
        "LOCAL_FUZZY_PROB" {
            weight = 5.0;
            description = "Probable fuzzy hash";
        }
        "LOCAL_FUZZY_WHITE" {
            weight = -2.1;
            description = "Whitelisted fuzzy hash";
        }
        "FUZZY_AUTO" {
            weight = {{ .Values.rspamd.fuzzy_autolearn.weight }};
            description = "Matches spam learned automatically into fuzzy storage";
        }
    }
{{- if .Values.rspamd.fuzzy_autolearn.enabled }}
  fuzzy_autolearn.lua: |
    -- Learn inbound spam that already scores high into the local fuzzy storage
    -- (FUZZY_LOCAL, flag {{ .Values.rspamd.fuzzy_autolearn.flag }} = FUZZY_AUTO), so later copies of the same campaign match.
    -- Each learn adds weight 1, so a one-off false positive scores little while a repeated
    -- campaign quickly reaches the full FUZZY_AUTO weight. Hashes expire with the fuzzy worker.
    local rspamd_logger = require "rspamd_logger"

    local FLAG = {{ .Values.rspamd.fuzzy_autolearn.flag }}
    local MIN_SCORE = {{ .Values.rspamd.fuzzy_autolearn.min_score }}
    -- Their scores are taken off before comparing, so a fuzzy match cannot push a
    -- message over the threshold and relearn itself.
    local FUZZY_SYMBOLS = { "FUZZY_AUTO", "FUZZY_DENIED", "FUZZY_PROB", "FUZZY_UNKNOWN" }
    -- Never learn these: hand-whitelisted content, and bounces, whose generic DSN text
    -- would then match every bounce from the same MTA.
    local SKIP_SYMBOLS = { "FUZZY_WHITE", "BOUNCE" }

    rspamd_config:register_symbol({
      name = "FUZZY_AUTOLEARN_CHECK",
      type = "idempotent",  -- runs once the final score is known
      callback = function(task)
        if task:get_user() or task:has_flag("no_stat") or task:has_flag("skip") then
          return  -- authenticated outbound mail, or settings that turned statistics off
        end
        local ip = task:get_from_ip()
        if ip and ip:is_valid() and ip:is_local() then return end
        for _, sym in ipairs(SKIP_SYMBOLS) do
          if task:has_symbol(sym) then return end
        end
        local score = task:get_metric_score("default")[1] or 0
        for _, sym in ipairs(FUZZY_SYMBOLS) do
          local res = task:get_symbol(sym)
          if res and res[1] and res[1].score then score = score - res[1].score end
        end
        if score < MIN_SCORE then return end
        local fc = rspamd_plugins.fuzzy_check
        if not (fc and fc.learn) then return end
        if fc.learn(task, FLAG, 1.0) then
          rspamd_logger.infox(task, "fuzzy_autolearn: learned flag %s, score %s without fuzzy", FLAG, score)
        end
      end,
    })
{{- end }}
  mx_check.conf: |
    enabled = true;

    exclude_domains = [
      "${CONFDIR}/local.d/maps.d/mx_check_exclude_domains.inc",
      "https://maps.rspamd.com/rspamd/dmarc_whitelist_new.inc",
      "https://maps.rspamd.com/rspamd/spf_dkim_whitelist.inc",
      "https://maps.rspamd.com/rspamd/maillist.inc",
      "https://maps.rspamd.com/freemail/free.txt.zst",
      "https://maps.rspamd.com/freemail/disposable.txt.zst",
    ];

    exclude_mxs = [
        "${CONFDIR}/local.d/maps.d/mx_check_exclude_mxs.inc",
    ];
  neural.conf: |
    enabled = true;
  multimap.conf: |
    IP_WHITELIST {
        type = "ip";
        prefilter = true;
        map = "/etc/rspamd/local.d/whitelist_ip.map";
        action = "accept";
    }
    # WHITELIST_SENDER_DOMAIN and TRUSTED_ENVELOPE_FROM only look at the
    # (unauthenticated) envelope sender, so they are markers now. The -6
    # is applied by the *_AUTH composites in composites.conf, which also
    # require SPF to pass, or DMARC to pass with From == envelope sender.
    WHITELIST_SENDER_DOMAIN {
        type = "from";
        filter = "email:domain";
        map = "/etc/rspamd/local.d/whitelist_sender_domain.map";
        score = 0.0;
        description = "Envelope sender domain is on the whitelist (marker, see WHITELIST_SENDER_DOMAIN_AUTH)";
    }
    TRUSTED_ENVELOPE_FROM {
      type = "from";
      filter = "email:addr";
      map = "redis://trusted_senders";   # name of a Redis hash
      score = 0.0;
      description = "Envelope sender is in the trusted list (marker, see TRUSTED_ENVELOPE_FROM_AUTH)";
      disable_multisymbol = true;
    }
    # List-manager command addresses legitimately receive mail with an
    # empty Subject (subscribe/unsubscribe in the body).
    LIST_COMMAND_RCPT {
      type = "rcpt";
      filter = "email:addr";
      regexp = true;
      map = "/etc/rspamd/local.d/list_command_rcpt.map";
      score = 0.0;
      description = "Recipient is a list command address (marker)";
    }
    # Sender domains under TLDs that are almost exclusively spam in the
    # postconfirm stash (9k of 176k stashed messages; 5 delivered in 3 days).
    FROM_ABUSED_TLD {
      type = "header";
      header = "From";
      filter = "email:domain";
      regexp = true;
      map = "/etc/rspamd/local.d/abused_tlds.map";
      score = 3.0;
      description = "From: domain is under a heavily abused TLD";
    }
    ENVFROM_ABUSED_TLD {
      type = "from";
      filter = "email:domain";
      regexp = true;
      map = "/etc/rspamd/local.d/abused_tlds.map";
      score = 1.5;
      description = "Envelope sender domain is under a heavily abused TLD";
    }
    SPF_STRICT_DOMAIN {
      type = "from";              # envelope sender (MAIL FROM), which is what SPF checks
      filter = "email:domain";
      map = "/etc/rspamd/local.d/spf_strict_domains.map";
      score = 0.0;                # only a marker, adds no score
      description = "Sender domain gets strict SPF handling";
    }
  force_actions.conf: |
    rules {
      SPF_SOFTFAIL_STRICT_REJECT {
        action = "reject";
        expression = "R_SPF_SOFTFAIL & SPF_STRICT_DOMAIN";
        message = "SPF softfail not accepted for this sender domain";
      }
    }
  composites.conf: |
    # The web UI had EMPTY_SUBJECT and this composite at +20, which rejected
    # list commands (e.g. subscribe to foo-request@) whenever the inflated
    # ham weights were removed. List command addresses are exempt.
    EMPTY_SUBJECT_UNCAPPED {
      expression = "EMPTY_SUBJECT & !LIST_COMMAND_RCPT";
      score = {{ .Values.rspamd.empty_subject_score }};
      policy = "remove_weight";
      description = "Empty subject, scored outside the capped headers group";
    }
    # Whitelist/trusted credit only when the sender is authenticated:
    # SPF pass for the envelope domain, or DMARC pass with From == envelope.
    WHITELIST_SENDER_DOMAIN_AUTH {
      expression = "WHITELIST_SENDER_DOMAIN & (R_SPF_ALLOW | (DMARC_POLICY_ALLOW & FROM_EQ_ENVFROM))";
      score = -6.0;
      policy = "leave";
      description = "Whitelisted envelope sender domain, authenticated";
    }
    TRUSTED_ENVELOPE_FROM_AUTH {
      expression = "TRUSTED_ENVELOPE_FROM & (R_SPF_ALLOW | (DMARC_POLICY_ALLOW & FROM_EQ_ENVFROM))";
      score = -6.0;
      policy = "leave";
      description = "Trusted envelope sender, authenticated";
    }
    # Weights previously set in the web UI (rspamd_dynamic) for stock composites.
    FREEMAIL_REPLYTO_NEQ_FROM { score = 3.0; }
    BAD_REP_POLICIES { score = 3.0; }
    SUSPICIOUS_URL_IN_SUSPICIOUS_MESSAGE { score = 5.0; }
  groups.conf: |
    # Symbol weights. These used to be set in the controller web UI, which
    # saves them to /var/lib/rspamd/rspamd_dynamic (not in git, and higher
    # priority than local.d). Change weights here instead.
    #
    # Deliberately NOT carried over from rspamd_dynamic (reverted to stock):
    #   BAYES_HAM -6 (stock -3), DMARC_POLICY_ALLOW -2.5 (stock -0.5),
    #   FROM_EQ_ENVFROM -2 (stock 0), R_DKIM_ALLOW -1.2 (stock -0.1),
    #   EMPTY_SUBJECT +20 (stock 1; real score is EMPTY_SUBJECT_UNCAPPED),
    #   TRUSTED_ENVELOPE_FROM -8 (now TRUSTED_ENVELOPE_FROM_AUTH).
    # Together these gave any spammer with SPF+DKIM+DMARC on its own domain
    # about -5.7 before content checks, and Bayes then autolearned it as ham.
    group "statistics" {
      symbols {
        "BAYES_SPAM" { weight = 8.0; }
      }
    }
    group "rbl" {
      symbols {
        "RECEIVED_SPAMHAUS_XBL" { weight = 1.0; }
        "RECEIVED_SPAMHAUS_PBL" { weight = 0.0; }
        "RECEIVED_SPAMHAUS_SBL" { weight = 2.0; }
        "RECEIVED_SPAMHAUS_DROP" { weight = 4.0; }
        "RBL_SPAMHAUS_CSS" { weight = 4.0; }
        "RBL_SPAMHAUS_PBL" { weight = 2.0; }
        "RBL_SPAMHAUS_SBL" { weight = 2.0; }
        "RBL_SPAMHAUS_XBL" { weight = 2.0; }
        "RBL_MAILSPIKE_WORST" { weight = 2.0; }
        "RBL_MAILSPIKE_VERYBAD" { weight = 4.5; }
        "RBL_VIRUSFREE_BOTNET" { weight = 6.0; }
        "URIBL_BLACK" { weight = 7.5; }
      }
    }
    group "hfilter" {
      symbols {
        "RDNS_NONE" { weight = 4.0; }
        "HFILTER_HOSTNAME_UNKNOWN" { weight = 2.5; }
        "HFILTER_HELO_NORES_A_OR_MX" { weight = 3.3; }
        "HFILTER_FROMHOST_NORES_A_OR_MX" { weight = 3.5; }
        "HFILTER_HELO_2" { weight = 3.0; }
      }
    }
    group "headers" {
      symbols {
        "R_BAD_CTE_7BIT" { weight = 3.5; }
        "MISSING_TO" { weight = 4.0; }
        "R_UNDISC_RCPT" { weight = 5.0; }
        "SUSPICIOUS_RECIPS" { weight = 0.5; }
        "ONCE_RECEIVED_STRICT" { weight = 2.0; }
      }
    }
    group "html" {
      symbols {
        "MANY_INVISIBLE_PARTS" { weight = 5.0; }
      }
    }
    group "body" {
      symbols {
        "R_PARTS_DIFFER" { weight = 2.0; }
      }
    }
    group "neural" {
      symbols {
        "NEURAL_SPAM" { weight = 3.0; }
        "NEURAL_HAM" { weight = -2.0; }
      }
    }
    group "mx" {
      symbols {
        "MX_INVALID" { weight = 0.5; }
      }
    }
  regexp.conf: |
    # Zero-width / invisible characters used to split words so filters miss
    # them. 6.5k of 176k stashed messages match this in the Subject.
    # Alternative 1: U+200B ZWSP, U+2060 WJ, U+FEFF ZWNBSP, U+00AD soft
    #   hyphen anywhere in the subject.
    # Alternative 2: U+200C ZWNJ / U+200D ZWJ between Latin or Japanese/CJK
    #   letters (these have legitimate uses in emoji sequences and in
    #   Persian/Indic scripts, which this leaves alone).
    SUBJ_INVISIBLE_CHARS {
      re = 'Subject=/[\x{200B}\x{2060}\x{FEFF}\x{00AD}]|[A-Za-z\x{3040}-\x{30FF}\x{4E00}-\x{9FFF}][\x{200C}\x{200D}][A-Za-z\x{3040}-\x{30FF}\x{4E00}-\x{9FFF}]/u';
      score = 5.0;
      group = "local_obfuscation";
      description = "Subject contains invisible characters used to split words";
    }
    # Same trick inside body text words. Weaker: some newsletters pad
    # preheaders with ZWNJ, though rarely between two letters.
    # {mime} = decoded text parts. ({sa_body} also covers the Subject and
    # has invisible characters normalised away, so it never matches.)
    BODY_INVISIBLE_IN_WORD {
      re = '/[A-Za-z][\x{200B}\x{200C}\x{200D}\x{2060}\x{FEFF}]+[A-Za-z]/u{mime}';
      score = 2.0;
      group = "local_obfuscation";
      description = "Body text has words split by invisible characters";
    }
  list_command_rcpt.map: |
    /-(request|join|leave|owner|subscribe|unsubscribe|confirm)(\+[^@]*)?@/i
  abused_tlds.map: |
{{- range .Values.rspamd.abused_tlds }}
    /\.{{ . }}$/i
{{- end }}
  spf_strict_domains.map: |
{{- range .Values.rspamd.spf_strict_domains }}
    {{ . }}
{{- end }}
  whitelist_ip.map: |
{{- range .Values.rspamd.whitelist_ip }}
    {{ . }}
{{- end }}
  whitelist_sender_domain.map: |
{{- range .Values.rspamd.whitelist_sender_domain }}
    {{ . }}
{{- end }}
  greylist.conf: |
{{- if .Values.rspamd.disableGreylisting }}
    enabled = false;
{{- end }}
  actions.conf: |
    add_header = {{ .Values.rspamd.add_header }};
    reject = {{ .Values.rspamd.reject }};
{{- if .Values.rspamd.disableGreylisting }}
    greylist = null;
{{- end }}
  logging.inc: |
    level = {{ .Values.rspamd.logging.level | quote }};
    log_usec = {{ .Values.rspamd.logging.log_usec }};
    debug_modules = {{ .Values.rspamd.logging.debug_modules | toJson }};
{{- if .Values.valkey.enabled }}
  redis.conf: |
    servers = "{{ .Release.Name }}-valkey:6379";
  history_redis.conf: |
    servers = "{{ .Release.Name }}-valkey:6379";
    key_prefix = {{ .Values.rspamd.historyRedis.keyPrefix | quote }};
    nrows = {{ .Values.rspamd.historyRedis.nrows }};
    compress = {{ .Values.rspamd.historyRedis.compress }};
    subject_privacy = {{ .Values.rspamd.historyRedis.subjectPrivacy }};
  classifier-bayes.conf: |
    backend = "redis";
    autolearn {
      spam_threshold = {{ .Values.rspamd.spam_autolearn_threshold }};
      ham_threshold = {{ .Values.rspamd.ham_autolearn_threshold }};
      check_balance = true;
    }
{{- else }}
  classifier-bayes.conf: ""
{{- end }}
  worker-controller.inc: |
    secure_ip = ["127.0.0.1", "::1", "10.0.0.0/8"];   # add your Prometheus host / pod CIDR
  worker-normal.inc: |
    bind_socket = "*:11333";
  worker-proxy.inc: |
    bind_socket = "*:11332";
    milter = true;
    log_tag_type = "queue_id";

    upstream "local" {
      default = yes;
      #self_scan = true;
      hosts = "localhost";
      # Use MTA's Queue-ID for log correlation
      log_tag_type = "queue_id";
    }
  dkim_signing.conf: |
{{- if .Values.rspamd.dkimRedis }}
    use_redis = true;
    key_prefix = "DKIM_PRIVKEYS";
    selector_prefix = "DKIM_SELECTORS";
{{- end }}
    allow_hdrfrom_mismatch_sign_networks = {{ .Values.rspamd.dkim.allow_hdrfrom_mismatch_sign_networks }};
    allow_username_mismatch = {{ .Values.rspamd.dkim.allow_username_mismatch }};
    sign_authenticated = {{ .Values.rspamd.dkim.sign_authenticated }};
    sign_local = {{ .Values.rspamd.dkim.sign_local }};
    sign_inbound = {{ .Values.rspamd.dkim.sign_inbound }};
    use_domain = {{ .Values.rspamd.dkim.use_domain | quote }};
    use_esld = {{ .Values.rspamd.dkim.use_esld }};
    allow_hdrfrom_mismatch = {{ .Values.rspamd.dkim.allow_hdrfrom_mismatch }};
    {{- if .Values.rspamd.dkim.domains }}
    domain {
      {{- range $domain := .Values.rspamd.dkim.domains }}
        {{ $domain.name | quote }} {
            path = "/var/lib/rspamd/dkim/{{ $domain.name }}.{{ $domain.selector }}.key";
            selector = {{ $domain.selector | toString | quote }};
        }
        {{- end }}
    }
    {{- end }}
{{- if eq (toString .Values.rspamd.arc.enabled) "true" }}
  arc.conf: |
    selector = {{ .Values.rspamd.arc.selector | toString | quote }};
    path = "/var/lib/rspamd/arc/$domain.$selector.key";

    use_domain = {{ .Values.rspamd.arc.use_domain | quote }};
    use_esld = {{ .Values.rspamd.arc.use_esld }};
    sign_local = {{ .Values.rspamd.arc.sign_local }};
    sign_inbound = {{ .Values.rspamd.arc.sign_inbound }};
    sign_authenticated = {{ .Values.rspamd.arc.sign_authenticated }};
    allow_envfrom_empty = {{ .Values.rspamd.arc.allow_envfrom_empty }};
    allow_hdrfrom_mismatch = {{ .Values.rspamd.arc.allow_hdrfrom_mismatch }};
    allow_hdrfrom_mismatch_local = {{ .Values.rspamd.arc.allow_hdrfrom_mismatch_local }};
    allow_hdrfrom_mismatch_sign_networks = {{ .Values.rspamd.arc.allow_hdrfrom_mismatch_sign_networks }};
    allow_hdrfrom_multiple = {{ .Values.rspamd.arc.allow_hdrfrom_multiple }};
    allow_username_mismatch = {{ .Values.rspamd.arc.allow_username_mismatch }};
    sign_headers = {{ .Values.rspamd.arc.sign_headers | quote }};
    {{- if .Values.rspamd.arc.domains }}
    domain {
      {{- range $domain := .Values.rspamd.arc.domains }}
        {{ $domain.name | quote }} {
            path = "/var/lib/rspamd/arc/{{ $domain.name }}.{{ $domain.selector }}.key";
            selector = {{ $domain.selector | toString | quote }};
        }
        {{- end }}
    }
    {{- end }}
{{- end }}

{{- if .Values.rspamd.milterHeaders }}
  milter_headers.conf: |
{{ .Values.rspamd.milterHeaders | indent 4 }}
{{- end }}
