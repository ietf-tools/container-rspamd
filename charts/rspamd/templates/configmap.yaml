apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rspamd.fullname" . }}
  labels: {{- include "rspamd.labels" . | nindent 4}}
data:
{{- if .Values.rspamd.jevEnabled }}
  rspamd.conf.local: |
    jev {
      .include "$LOCAL_CONFDIR/local.d/jev.conf"
    }
  jev.conf: |
    enabled = true;
    mode = "live";
    url = "https://api.typesafe.ai/v1/systemone";
    model = "jev-1.14.0";
    allow_external = true;
    # set by read -rs JEV_KEY && printf '%s' "$JEV_KEY" | redis-cli -x SET jev_api_key; unset JEV_KEY
    api_key_redis_key = "jev_api_key";
    recipient_domains = ["*"];

    # Optional: require an existing gpt module result before querying Jev.
    # false works with plain Rspamd; true requires GPT_CHECK and GPT_* results.
    require_gpt = false;
    sample_rate = 1.0;
    timeout = 1.5;

    # PER WORKER, not global. No retries or cache.
    requests_per_second = 100;
    max_inflight = 20;
    cooldown = 60;

    max_message_bytes = 1048576;
    max_body_bytes = 16000;
    max_request_bytes = 49152;
    max_urls = 32;
    max_attachments = 8;

    # Only changes observation labels; never changes scores or actions.
    probability_threshold = {{ .Values.rspamd.jevProbabilityThreshold }};
    confidence_threshold = {{ .Values.rspamd.jevConfidenceThreshold }};
{{- end }}
  settings.conf: |
    list_bounces {
      priority = high;
      # Mailman bounce addresses: plain, VERP (+user=dom) and DMARC-mangled (=40)
      rcpt = "/-bounces([+=@])/i";
      apply {
        # skip Bayes for these messages: no BAYES_* scoring, no autolearn
        flags = ["no_stat"];
      }
    }
  spamtrap.conf: |
    enabled = true;
    action = "no action";
    score = 1.0;
    learn_fuzzy = true;
    learn_spam = true;
    # map removed → Redis lookups are used instead
    # key_prefix = "sptr_";   # default, change if you like
  worker-fuzzy.inc: |
    count = 2;
    bind_socket = "*:11335";
    backend = "redis";        # uses the servers from local.d/redis.conf
    expire = 90d;
    allow_update = ["127.0.0.1", "::1"];
  fuzzy_check.conf: |
    rule "SPAM_CAMPAIGNS" {
      servers = "localhost:11335";
      algorithm = "mumhash";

      fuzzy_map = {
        FUZZY_SPAM_TEMPLATES {
          flag = 200;
          hits_limit = 15.0;
        }
      }
    }

    rule "FUZZY_LOCAL" {
      # Server(s) to query - required
      servers = "localhost:11335";

      # Hash algorithm: mumhash (default), fasthash, xxhash, siphash
      algorithm = "mumhash";

      # Allow write operations (learning) to this storage; set true to disallow
      read_only = false;
      text_shingles = true;
      html_shingles = true;
      min_html_tags = 15;
      html_weight = 1.0;

      # Map flags to symbols
      fuzzy_map = {
        FUZZY_DENIED {
          flag = 1;
          max_score = 20.0;
        }
        FUZZY_PROB {
          flag = 2;
          max_score = 10.0;
        }
        FUZZY_WHITE {
          flag = 3;
          max_score = 2.0;
        }
      }
    }
  fuzzy_group.conf: |
    max_score = 12.0;
    symbols = {
        "FUZZY_DENIED" {
            weight = 12.0;
            description = "Denied fuzzy hash";
        }
        "FUZZY_PROB" {
            weight = 5.0;
            description = "Probable fuzzy hash";
        }
        "FUZZY_WHITE" {
            weight = -2.1;
            description = "Whitelisted fuzzy hash";
        }
        "FUZZY_UNKNOWN" {
            weight = 5.0;
            description = "Generic fuzzy hash match";
        }
        "LOCAL_FUZZY_UNKNOWN" {
            weight = 5.0;
            description = "Generic fuzzy hash match";
        }
        "LOCAL_FUZZY_DENIED" {
            weight = 12.0;
            description = "Denied fuzzy hash";
        }
        "LOCAL_FUZZY_PROB" {
            weight = 5.0;
            description = "Probable fuzzy hash";
        }
        "LOCAL_FUZZY_WHITE" {
            weight = -2.1;
            description = "Whitelisted fuzzy hash";
        }
    }
  mx_check.conf: |
    enabled = true;

    exclude_domains = [
      "${CONFDIR}/local.d/maps.d/mx_check_exclude_domains.inc",
      "https://maps.rspamd.com/rspamd/dmarc_whitelist_new.inc",
      "https://maps.rspamd.com/rspamd/spf_dkim_whitelist.inc",
      "https://maps.rspamd.com/rspamd/maillist.inc",
      "https://maps.rspamd.com/freemail/free.txt.zst",
      "https://maps.rspamd.com/freemail/disposable.txt.zst",
    ];

    exclude_mxs = [
        "${CONFDIR}/local.d/maps.d/mx_check_exclude_mxs.inc",
    ];
  neural.conf: |
    enabled = true;
  multimap.conf: |
    IP_WHITELIST {
        type = "ip";
        prefilter = true;
        map = "/etc/rspamd/local.d/whitelist_ip.map";
        action = "accept";
    }
    WHITELIST_SENDER_DOMAIN {
        type = "from";
        filter = "email:domain";
        map = "/etc/rspamd/local.d/whitelist_sender_domain.map";
        score = -6.0
    }
    TRUSTED_ENVELOPE_FROM {
      type = "from";
      filter = "email:addr";
      map = "redis://trusted_senders";   # name of a Redis hash
      score = -6.0;
      description = "Envelope sender is in the trusted list";
      disable_multisymbol = true;
    }
    SPF_STRICT_DOMAIN {
      type = "from";              # envelope sender (MAIL FROM), which is what SPF checks
      filter = "email:domain";
      map = "/etc/rspamd/local.d/spf_strict_domains.map";
      score = 0.0;                # only a marker, adds no score
      description = "Sender domain gets strict SPF handling";
    }
  force_actions.conf: |
    rules {
      SPF_SOFTFAIL_STRICT_REJECT {
        action = "reject";
        expression = "R_SPF_SOFTFAIL & SPF_STRICT_DOMAIN";
        message = "SPF softfail not accepted for this sender domain";
      }
    }
  composites.conf: |
    EMPTY_SUBJECT_UNCAPPED {
      expression = "EMPTY_SUBJECT";
      score = 8.0;
      policy = "remove_weight";
      description = "Empty subject, scored outside the capped headers group";
    }
  spf_strict_domains.map: |
{{- range .Values.rspamd.spf_strict_domains }}
    {{ . }}
{{- end }}
  whitelist_ip.map: |
{{- range .Values.rspamd.whitelist_ip }}
    {{ . }}
{{- end }}
  whitelist_sender_domain.map: |
{{- range .Values.rspamd.whitelist_sender_domain }}
    {{ . }}
{{- end }}
  greylist.conf: |
{{- if .Values.rspamd.disableGreylisting }}
    enabled = false;
{{- end }}
  actions.conf: |
    add_header = {{ .Values.rspamd.add_header }};
    reject = {{ .Values.rspamd.reject }};
{{- if .Values.rspamd.disableGreylisting }}
    greylist = null;
{{- end }}
  logging.inc: |
    level = "{{ .Values.rspamd.logging.level }}";
    log_usec = {{ .Values.rspamd.logging.log_usec }};
    debug_modules = {{ .Values.rspamd.logging.debug_modules | toJson }};
{{- if .Values.valkey.enabled }}
  redis.conf: |
    servers = "{{ .Release.Name }}-valkey:6379";
  history_redis.conf: |
    servers = {{ .Release.Name }}-valkey:6379;
    key_prefix = "{{ .Values.rspamd.historyRedis.keyPrefix }}";
    nrows = {{ .Values.rspamd.historyRedis.nrows }};
    compress = {{ .Values.rspamd.historyRedis.compress }};
    subject_privacy = {{ .Values.rspamd.historyRedis.subjectPrivacy }};
  classifier-bayes.conf: |
    backend = "redis";
    autolearn {
      spam_threshold = {{ .Values.rspamd.spam_autolearn_threshold }};
      ham_threshold = {{ .Values.rspamd.ham_autolearn_threshold }};
      check_balance = true;
    }
{{- else }}
  classifier-bayes.conf: ""
{{- end }}
  worker-controller.inc: |
    secure_ip = ["127.0.0.1", "::1", "10.0.0.0/8"];   # add your Prometheus host / pod CIDR
  worker-normal.inc: |
    bind_socket = "*:11333";
  worker-proxy.inc: |
    bind_socket = "*:11332";
    milter = true;
    log_tag_type = "queue_id";

    upstream "local" {
      default = yes;
      #self_scan = true;
      hosts = "localhost";
      # Use MTA's Queue-ID for log correlation
      log_tag_type = "queue_id";
    }
  dkim_signing.conf: |
{{- if .Values.rspamd.dkimRedis }}
    use_redis = true;
    key_prefix = "DKIM_PRIVKEYS";
    selector_prefix = "DKIM_SELECTORS";
{{- end }}
    allow_hdrfrom_mismatch_sign_networks = {{ .Values.rspamd.dkim.allow_hdrfrom_mismatch_sign_networks }};
    allow_username_mismatch = {{ .Values.rspamd.dkim.allow_username_mismatch }};
    sign_authenticated = {{ .Values.rspamd.dkim.sign_authenticated }};
    sign_local = {{ .Values.rspamd.dkim.sign_local | quote }};
    sign_inbound = {{ .Values.rspamd.dkim.sign_inbound | quote }};
    use_domain = {{ .Values.rspamd.dkim.use_domain | quote }};
    use_esld = {{ .Values.rspamd.dkim.use_esld }};
    allow_hdrfrom_mismatch = {{ .Values.rspamd.dkim.allow_hdrfrom_mismatch }};
    {{- if .Values.rspamd.dkim.domains }}
    domain {
      {{- range $domain := .Values.rspamd.dkim.domains }}
        {{ $domain.name }} {
            path = "/var/lib/rspamd/dkim/{{ $domain.name }}.{{ $domain.selector }}.key";
            selector = "{{ $domain.selector }}";
        }
        {{- end }}
    }
    {{- end }}
{{- if .Values.rspamd.arc.enabled }}
  arc.conf: |
    selector = {{ .Values.rspamd.arc.selector }}
    path = "/var/lib/rspamd/arc/$domain.$selector.key";

    use_domain = {{ .Values.rspamd.arc.use_domain }}
    use_esld = {{ .Values.rspamd.arc.use_esld }}
    sign_local = {{ .Values.rspamd.arc.sign_local }}
    sign_inbound = {{ .Values.rspamd.arc.sign_inbound }}
    sign_authenticated = {{ .Values.rspamd.arc.sign_authenticated }}
    allow_envfrom_empty = {{ .Values.rspamd.arc.allow_envfrom_empty }}
    allow_hdrfrom_mismatch = {{ .Values.rspamd.arc.allow_hdrfrom_mismatch }}
    allow_hdrfrom_mismatch_local = {{ .Values.rspamd.arc.allow_hdrfrom_mismatch_local }}
    allow_hdrfrom_mismatch_sign_networks = {{ .Values.rspamd.arc.allow_hdrfrom_mismatch_sign_networks }}
    allow_hdrfrom_multiple = {{ .Values.rspamd.arc.allow_hdrfrom_multiple }}
    allow_username_mismatch = {{ .Values.rspamd.arc.allow_username_mismatch }}
    sign_headers = "{{ .Values.rspamd.arc.sign_headers }}";
    {{- if .Values.rspamd.arc.domains }}
    domain {
      {{- range $domain := .Values.rspamd.arc.domains }}
        {{ $domain.name }} {
            path = "/var/lib/rspamd/arc/{{ $domain.name }}.{{ $domain.selector }}.key";
            selector = "{{ $domain.selector }}";
        }
        {{- end }}
    }
    {{- end }}
{{- end }}

{{- if .Values.rspamd.milterHeaders }}
  milter_headers.conf: |
{{ .Values.rspamd.milterHeaders | indent 4 }}
{{- end }}
